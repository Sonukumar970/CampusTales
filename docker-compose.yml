version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: campustales-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - campustales-network

  # Backend REST API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campustales-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - MONGO_URI=mongodb://mongodb:27017/campustales
      - JWT_SECRET=campustales_production_secret_key_2025
      - JWT_EXPIRE=30d
    depends_on:
      - mongodb
    networks:
      - campustales-network

  # Frontend Web Client Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: campustales-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - campustales-network

volumes:
  mongo_data:
    driver: local

networks:
  campustales-network:
    driver: bridge
